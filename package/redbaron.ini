# redbaron.ini - Red Baron Enhanced, the settings as shipped.
# Your own go into save/redbaron.ini (same names); what is not there is
# taken from here.

# Where to look for the ROMs first (a folder or redbaron.zip).
rom_path =

# --- the picture ---------------------------------------------------------
# What of the vector generator's screen is shown (its units, middle 0,0).
view_left   = -260
view_right  = 260
view_bottom = -200
view_top    = 200
# Room left free on the board (0..4095), to size and place the picture.
margin_left   = 0
margin_right  = 0
margin_bottom = 0
margin_top    = 0
flip_x = no
flip_y = no
brightness = 1.0
gamma      = 0.6
floor      = 0.15
# The cabinet's tube is white behind a blue sheet.
color = 110 190 255

# --- additions -----------------------------------------------------------
# Motion between the game's frames: 3 (as shipped) computed from the
# game's state with its own drawing routines, as in Star Wars Enhanced;
# 0 each frame's picture as on the cabinet (10 a second).
smooth = 3
# A colour for every line by what it is (the enemy red, the land green,
# shells yellow); no: everything in the cabinet's one colour (color, above).
color_lines = yes
# What is nearer hides what is behind it: the biplane its far wing, the
# mountains what lies behind them, a bunker the ridge it stands on.
occlusion = yes
# Trees on the land below the horizon, clouds high above it, drawn as the
# game draws its own objects.
trees = yes
clouds = yes
# The bezel's cockpit drawn into the picture, seen from the seat: the two
# machine guns (they kick and flash as they fire), the struts to the upper
# wing, the dashboard with altimeter, airspeed and the guns' temperature.
# Only a picture: the game plays as before.
cockpit = yes
# The port's own title (iron cross, eagle, "Red Baron" written on), high
# score table and initials entry, on the game's own pages for them.
screens = yes
# An empty high score table gets the aces of 1917 (Richthofen, Udet, ...)
# in its empty places, so that the attract mode shows a table.
default_scores = yes
# The attract mode shows real gameplay: a second, silent machine plays a
# game flown by an autopilot (instead of the plane flying at the player and
# backing away again). The real game is not touched.
attract_demo = yes
# A fireball and sparks where something blows up.
explosions = yes

# --- the sound -----------------------------------------------------------
volume = 0.8
# samples: recordings instead of the board's circuits (package/sounds, from
# Freesound: see sounds/CREDITS.txt): a Fokker's rotary engine, faster
# diving and slower climbing; a Nieuport coming at the player; the Maxim
# machine gun; explosions; a plane spinning down. The tunes stay the
# POKEY's. original: the board's sounds alone.
sounds = samples
# the recorded engine's loudness, 0 to 1 (it sounds all game long)
engine_volume = 0.7

# --- the cabinet's option switches ---------------------------------------
# english, spanish, french, german
language = english
# 0 none, 1: 6000 20000 50000, 2: 4000 15000 40000, 3: 2000 10000 30000
bonus = 1
# 2 to 5
lives = 3
two_play_minimum = no
# the game adjusts its difficulty to the average game time
self_adjust = no
# free, 2plays (1 coin 2 plays), 1play (1 coin 1 play), 2coins (2 coins 1 play).
# free: the attract mode runs as usual, START begins a game (the board's own
# free play would stand at PRESS START for ever).
coin_mode = 1play

# --- the controls (the main ones also in the test menu: the service key,
# advmame.rc's input_map[service], F2 if it has none) ---------------------
# analog: a yoke or analog stick (the keys and a stick of switches still
# work, as digital); digital: a joystick of switches or the keys only (a
# stick that reports its switches as an axis is then not taken as analog).
controls = analog
# A digital stick, held, moves out to full deflection in 1/digital_rate
# seconds, as far as digital_reach (0.2..1); let go, it comes back in
# 1/digital_return seconds (0: at once).
digital_rate = 4
digital_reach = 1.0
digital_return = 6
# An analog stick: the middle that counts as nothing, and how far a push goes.
deadzone = 0.08
gain = 1.0
invert_y = no
# Start and fire held together for two seconds open the test menu too.
menu_hold = yes
# The program learns the stick's range from the player's moves and until
# then pulls the plane to one side. yes: it is told the range at power on.
stick_calibrate = yes
# What does what: auto (the cabinet's own controls by advmame.rc), none,
# "key <name>", "joy<n> button <b>", "joy<n> axis <a> +" (or -), "joy<n> hat <h> up" ...
bind_up = auto
bind_down = auto
bind_left = auto
bind_right = auto
bind_stick_x = auto
bind_stick_y = auto
bind_fire = auto
bind_start = auto
bind_coin = auto
bind_menu = auto
